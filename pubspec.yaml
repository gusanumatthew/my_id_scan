name: myid_scan
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  flutter_riverpod: ^2.5.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  hive_flutter: ^1.1.0
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  animated_text_kit: ^4.2.3
  device_preview: ^1.2.0
  cached_network_image: ^3.4.1
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^11.0.0
  crypto: ^3.0.6
  screenshot: ^3.0.0
  pdf: ^3.10.8
  path_provider: ^2.1.5
  path: ^1.9.0


dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.11
  flutter_gen_runner:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/card.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/svgs/
   
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200 
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300 # FontWeight.w300 for light
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400 # FontWeight.w400 for regular
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500 # FontWeight.w500 for medium
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600 # FontWeight.w600 for semi-bold
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700 # FontWeight.w700 for bold
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800 # FontWeight.w800 for extra bold
        


